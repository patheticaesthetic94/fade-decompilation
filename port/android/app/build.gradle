// Fade for Android: the web player's page (WebView) around the native game. Java glue is SDL2's
// (build/third_party) plus src/main/java, native code is port/CMakeLists.txt, and assets (game data
// and the player page) are staged into build/android-assets by tools/android_build.sh.
plugins { id 'com.android.application' }

def root = file('../../..')
def sdl = new File(root, 'build/third_party/SDL2-2.32.10')

android {
    namespace 'org.fadeport.fade'
    compileSdk 35
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'org.fadeport.fade'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.09.4'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '3.22.1+' } }
    sourceSets.main {
        java.srcDirs = ['src/main/java', new File(sdl, 'android-project/app/src/main/java')]
        // build/android-assets: fade/ hd/ fonts/ hdaudio/ (tools/stage_assets.py) and web/ (the player page);
        // src/main/shim: android/shim.js, which adapts that page to the native game.
        assets.srcDirs = [new File(root, 'build/android-assets'), 'src/main/shim']
    }
    androidResources { noCompress += ['fad', 'ifj', 'ifb', 'ifv', 'ifg', 'exe', 'txt', 'jpg', 'png'] }
    signingConfigs {
        release {
            def keyPath = System.getenv('FADE_RELEASE_KEYSTORE')
            def passwordPath = System.getenv('FADE_RELEASE_PASSWORD_FILE')
            if (keyPath && passwordPath) {
                storeFile file(keyPath)
                storePassword file(passwordPath).text.trim()
                keyAlias System.getenv('FADE_RELEASE_KEY_ALIAS') ?: 'fade-release'
                keyPassword storePassword
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    lint { abortOnError false }
}
